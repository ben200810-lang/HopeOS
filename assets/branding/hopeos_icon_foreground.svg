<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#B8A0F0"/>
      <stop offset="100%" stop-color="#9B7FE6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EB6E6"/>
      <stop offset="50%" stop-color="#B8A0F0"/>
      <stop offset="100%" stop-color="#7EB6E6"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9B7FE6"/>
      <stop offset="100%" stop-color="#7EB6E6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Heart shape (life) - centered within adaptive icon safe zone -->
  <path d="M256 320
    C225 295 150 250 150 195
    C150 160 175 140 205 140
    C228 140 247 153 256 172
    C265 153 284 140 307 140
    C337 140 362 160 362 195
    C362 250 287 295 256 320Z"
    fill="url(#heartGrad)"/>

  <!-- Pulse / timeline line -->
  <polyline
    points="100,275 175,275 210,275 232,242 248,295 268,200 286,260 302,225 330,275 345,275 412,275"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Upward arrow (hope / progress) -->
  <g transform="translate(256, 365)" opacity="0.8">
    <polyline
      points="-18,14 0,0 18,14"
      fill="none"
      stroke="url(#arrowGrad)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="25"
      stroke="url(#arrowGrad)"
      stroke-width="5"
      stroke-linecap="round"/>
  </g>
</svg>
