name: hopeos
description: "HopeOS – A personal life operating system for ADHD minds"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Legacy state management (kept for incremental migration)
  provider: ^6.1.2

  # Local database (Drift / SQLite – offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Legacy database (kept for migration bridge)
  sqflite: ^2.4.2

  # UUID generation
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.20.2

  # Shared preferences for settings
  shared_preferences: ^2.3.5

  # Animations
  flutter_staggered_animations: ^1.1.1

  # Health / Activity integration
  health: ^12.1.1

  # Local notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/hopeos_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/branding/hopeos_icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/knowledge/
    - assets/branding/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
